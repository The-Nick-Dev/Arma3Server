services:
  arma3:
    build: .
    platform: linux/amd64
    container_name: arma3
    volumes:
      - './configs:/arma3/server/configs'
      - './mods:/arma3/server/mods'
      - './servermods:/arma3/server/servermods'
      - './server:/arma3/server/'
    ports:
      - "2302:2302/udp"
      - "2303:2303/udp"
      - "2304:2304/udp"
      - "2305:2305/udp"
      - "2306:2306/udp"
    env_file: .env
    restart: unless-stopped
